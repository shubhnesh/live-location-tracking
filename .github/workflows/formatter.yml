name: Auto Format Dart Code

# Changed to workflow_call so it can be used as a nested/reusable workflow
on:
  workflow_call:

jobs:
  format:
    runs-on: ubuntu-latest
    
    permissions: 
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Use github.ref to ensure it grabs the exact commit that triggered the push
          ref: ${{ github.ref }}

      # Using setup-flutter here since it includes the Dart SDK naturally for Flutter projects
      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.0.2

      - name: Run Dart Formatter
        run: dart format .

      # Crucial: The 'id' here must match the prefix used in the 'if' condition below
      - name: Commit and Push Changes
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: automated dart format fixes"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@://github.com"

      # FIXED: Changed 'steps:auto-commit' to 'steps.auto-commit'
      - name: Cancel current run if files were formatted
        if: steps.auto-commit.outputs.changes_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Stopping current run: Unformatted files detected. A new workflow run has been triggered for the auto-formatted commit.');
